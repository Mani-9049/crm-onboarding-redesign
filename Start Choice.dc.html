<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;color:#18181b;-webkit-font-smoothing:antialiased;background:#fafaf9}
*{box-sizing:border-box}
a{color:#18181b}a:hover{color:#52525b}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:#fafaf9;">
  <header style="padding:32px clamp(20px,3.6vw,60px) 0;display:flex;align-items:center;gap:10px;">
    <span aria-hidden="true" style="width:30px;height:30px;border-radius:9px;background:#18181b;color:#fff;display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:19px;">all_inclusive</span>
    <span style="font-size:18px;font-weight:600;letter-spacing:-.02em;">Zoho CRM</span>
  </header>

  <main style="flex:1;width:100%;max-width:1015px;margin:0 auto;padding:48px clamp(20px,3vw,40px) 0;">
    <h1 style="margin:0 0 10px;font-size:clamp(30px,3.6vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1.05;">How would you like to <span style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:1.12em;letter-spacing:-.01em;">start?</span></h1>
    <p style="margin:0 0 36px;font-size:15px;color:#71717a;text-wrap:pretty;">Choose a starting point  you can always reshape your CRM with Zia after you're in.</p>

    <div role="radiogroup" aria-label="Starting point" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;">

      <button type="button" role="radio" aria-checked="{{ defSel }}" onClick="{{ pickDefault }}" style="text-align:left;display:flex;flex-direction:column;padding:8px;border-radius:20px;border:1px solid {{ defBorder }};background:#fff;box-shadow:{{ defShadow }};cursor:pointer;transition:border-color .2s, box-shadow .25s, transform .25s cubic-bezier(.2,.7,.2,1);" style-hover="transform:translateY(-2px);box-shadow:0 1px 2px rgba(24,24,27,.05),0 18px 36px -22px rgba(24,24,27,.3);" style-active="transform:scale(.99);" style-focus="outline:2px solid #18181b;outline-offset:3px;">
        <div aria-hidden="true" style="position:relative;height:196px;border-radius:14px;background:#f4f4f5;overflow:hidden;">
          <span style="position:absolute;top:12px;right:12px;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid #e4e4e7;font-size:12px;font-weight:500;color:#3f3f46;display:flex;align-items:center;gap:5px;"><span style="font-family:'Material Symbols Rounded';font-size:14px;">bolt</span>Start Immediately</span>
          <div style="position:absolute;left:28px;right:64px;top:34px;bottom:-12px;border-radius:10px;background:#fff;border:1px solid #e4e4e7;box-shadow:0 10px 30px -18px rgba(24,24,27,.35);display:flex;overflow:hidden;">
            <div style="width:62px;border-right:1px solid #f0f0f1;padding:10px 8px;display:flex;flex-direction:column;gap:7px;">
              <span style="width:16px;height:16px;border-radius:5px;background:#18181b;"></span>
              <span style="height:5px;border-radius:3px;background:#e4e4e7;"></span><span style="height:5px;border-radius:3px;background:#e4e4e7;width:80%;"></span><span style="height:5px;border-radius:3px;background:#e4e4e7;"></span><span style="height:5px;border-radius:3px;background:#e4e4e7;width:70%;"></span><span style="height:5px;border-radius:3px;background:#e4e4e7;"></span>
            </div>
            <div style="flex:1;padding:12px;display:flex;flex-direction:column;gap:9px;">
              <span style="height:7px;width:40%;border-radius:3px;background:#d4d4d8;"></span>
              <span style="height:5px;border-radius:3px;background:#f0f0f1;"></span><span style="height:5px;border-radius:3px;background:#f0f0f1;width:90%;"></span><span style="height:5px;border-radius:3px;background:#f0f0f1;"></span><span style="height:5px;border-radius:3px;background:#f0f0f1;width:85%;"></span><span style="height:5px;border-radius:3px;background:#f0f0f1;"></span>
            </div>
          </div>
          <div style="position:absolute;right:22px;bottom:18px;width:150px;padding:10px;border-radius:10px;background:#fff;border:1px solid #e4e4e7;box-shadow:0 16px 30px -14px rgba(24,24,27,.35);display:flex;flex-direction:column;gap:7px;">
            <div style="display:flex;gap:6px;align-items:center;"><span style="width:12px;height:12px;border-radius:4px;background:linear-gradient(135deg,#7c5cff,#e25aa8 60%,#ff9a62);"></span><span style="height:5px;flex:1;border-radius:3px;background:#e4e4e7;"></span></div>
            <span style="height:22px;border-radius:6px;background:#f4f4f5;"></span><span style="height:22px;border-radius:6px;background:#f4f4f5;"></span>
          </div>
        </div>
        <div style="padding:18px 16px 14px;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <span aria-hidden="true" style="width:20px;height:20px;border-radius:50%;border:1.5px solid {{ defRadio }};display:grid;place-items:center;transition:border-color .2s;"><span style="width:10px;height:10px;border-radius:50%;background:#18181b;transform:{{ defDot }};transition:transform .3s cubic-bezier(.3,1.6,.5,1);"></span></span>
            <span style="font-size:18px;font-weight:600;letter-spacing:-.02em;">Default CRM</span>
          </div>
          <p style="margin:0;font-size:14px;line-height:1.6;color:#52525b;text-wrap:pretty;">A complete CRM ready the moment you sign in. All standard modules already set up just add your data and go.</p>
        </div>
      </button>

      <button type="button" role="radio" aria-checked="{{ indSel }}" onClick="{{ pickIndustry }}" style="text-align:left;display:flex;flex-direction:column;padding:8px;border-radius:20px;border:1px solid {{ indBorder }};background:#fff;box-shadow:{{ indShadow }};cursor:pointer;transition:border-color .2s, box-shadow .25s, transform .25s cubic-bezier(.2,.7,.2,1);" style-hover="transform:translateY(-2px);box-shadow:0 1px 2px rgba(24,24,27,.05),0 18px 36px -22px rgba(24,24,27,.3);" style-active="transform:scale(.99);" style-focus="outline:2px solid #18181b;outline-offset:3px;">
        <div aria-hidden="true" style="position:relative;height:196px;border-radius:14px;background-color:#f4f4f5;background-image:linear-gradient(#ebebed 1px,transparent 1px),linear-gradient(90deg,#ebebed 1px,transparent 1px);background-size:28px 28px;background-position:center;overflow:hidden;">
          <span style="position:absolute;top:12px;right:12px;padding:5px 10px;border-radius:999px;background:#18181b;font-size:12px;font-weight:500;color:#fff;display:flex;align-items:center;gap:5px;"><span style="font-family:'Material Symbols Rounded';font-size:14px;font-variation-settings:'FILL' 1;">star</span>Recommended for most</span>
          <div style="position:absolute;left:50%;top:60%;width:220px;height:92px;transform:translate(-50%,-50%);border:1.5px dashed #d4d4d8;border-radius:14px;"></div>
          <span style="position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#7c5cff,#e25aa8 60%,#ff9a62);display:grid;place-items:center;color:#fff;font-family:'Material Symbols Rounded';font-size:28px;font-variation-settings:'FILL' 1;box-shadow:0 12px 26px -10px rgba(200,80,170,.6);">near_me</span>
          <span style="position:absolute;left:calc(50% - 128px);top:calc(60% - 62px);width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid #e4e4e7;display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:19px;color:#3f3f46;box-shadow:0 6px 14px -8px rgba(24,24,27,.3);">school</span>
          <span style="position:absolute;left:calc(50% + 90px);top:calc(60% - 62px);width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid #e4e4e7;display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:19px;color:#3f3f46;box-shadow:0 6px 14px -8px rgba(24,24,27,.3);">local_gas_station</span>
          <span style="position:absolute;left:calc(50% - 128px);top:calc(60% + 24px);width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid #e4e4e7;display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:19px;color:#3f3f46;box-shadow:0 6px 14px -8px rgba(24,24,27,.3);">account_balance</span>
          <span style="position:absolute;left:calc(50% + 90px);top:calc(60% + 24px);width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid #e4e4e7;display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:19px;color:#3f3f46;box-shadow:0 6px 14px -8px rgba(24,24,27,.3);">payments</span>
        </div>
        <div style="padding:18px 16px 14px;">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <span aria-hidden="true" style="width:20px;height:20px;border-radius:50%;border:1.5px solid {{ indRadio }};display:grid;place-items:center;transition:border-color .2s;"><span style="width:10px;height:10px;border-radius:50%;background:#18181b;transform:{{ indDot }};transition:transform .3s cubic-bezier(.3,1.6,.5,1);"></span></span>
            <span style="font-size:18px;font-weight:600;letter-spacing:-.02em;">Industry CRM</span>
          </div>
          <p style="margin:0;font-size:14px;line-height:1.6;color:#52525b;text-wrap:pretty;">Modules and workflows built for your sector. Pick your industry, choose your modules, and confirm then follow a guided setup.</p>
        </div>
      </button>
    </div>
  </main>

  <footer style="width:100%;max-width:1015px;margin:0 auto;padding:40px clamp(20px,3vw,40px) 44px;display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap;">
    <button type="button" onClick="{{ next }}" disabled="{{ noneSel }}" style="height:42px;padding:0 20px;display:flex;align-items:center;gap:8px;border-radius:12px;border:0;background:{{ nextBg }};color:#fff;font-size:14px;font-weight:600;cursor:{{ nextCursor }};transition:transform .15s, background .2s, filter .15s;" style-hover="filter:brightness(1.08);" style-active="transform:scale(.97);" style-focus="outline:2px solid #5b45d6;outline-offset:3px;">{{ nextLabel }}<span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:18px;">arrow_forward</span></button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { choice: null };
  renderVals() {
    const c = this.state.choice;
    const card = on => ({
      border: on ? '#18181b' : '#e4e4e7',
      shadow: on ? '0 0 0 3px rgba(24,24,27,.08), 0 18px 36px -22px rgba(24,24,27,.35)' : '0 1px 2px rgba(24,24,27,.04)',
      radio: on ? '#18181b' : '#d4d4d8', dot: on ? 'scale(1)' : 'scale(0)',
    });
    const d = card(c === 'default'), i = card(c === 'industry');
    return {
      defSel: c === 'default', defBorder: d.border, defShadow: d.shadow, defRadio: d.radio, defDot: d.dot,
      indSel: c === 'industry', indBorder: i.border, indShadow: i.shadow, indRadio: i.radio, indDot: i.dot,
      pickDefault: () => this.setState({ choice: 'default' }),
      pickIndustry: () => this.setState({ choice: 'industry' }),
      noneSel: !c, nextBg: c ? '#5b45d6' : '#c4c4cc', nextCursor: c ? 'pointer' : 'not-allowed',
      nextLabel: c === 'default' ? 'Launch CRM' : c === 'industry' ? 'Choose industry' : 'Continue',
      next: () => {},
    };
  }
}
</script>
</body>
</html>
