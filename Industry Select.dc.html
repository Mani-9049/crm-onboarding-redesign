<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;color:#18181b;-webkit-font-smoothing:antialiased;background:#fafaf9}
*{box-sizing:border-box}
a{color:#18181b}a:hover{color:#52525b}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;background:#fafaf9;">
  <header style="padding:32px clamp(20px,3.6vw,60px) 0;display:flex;align-items:center;gap:10px;">
    <span aria-hidden="true" style="width:30px;height:30px;border-radius:9px;background:#18181b;color:#fff;display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:19px;">all_inclusive</span>
    <span style="font-size:18px;font-weight:600;letter-spacing:-.02em;">Zoho CRM</span>
  </header>

  <main style="flex:1;width:100%;max-width:1015px;margin:0 auto;padding:48px clamp(20px,3vw,40px) 0;">
    <h1 style="margin:0 0 10px;font-size:clamp(30px,3.6vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1.05;">What industry are you <span style="font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:1.12em;letter-spacing:-.01em;">in?</span></h1>
    <p style="margin:0 0 36px;font-size:15px;color:#71717a;">I'll tailor your modules and setup to match.</p>

    <div role="radiogroup" aria-label="Industry" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px;">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="12">
        <button type="button" role="radio" aria-checked="{{ it.sel }}" onClick="{{ it.pick }}" style="position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:28px;padding:16px;min-height:132px;border-radius:16px;border:1px solid {{ it.border }};background:#fff;box-shadow:{{ it.shadow }};cursor:pointer;text-align:left;transition:border-color .2s, box-shadow .25s, transform .25s cubic-bezier(.2,.7,.2,1);" style-hover="transform:translateY(-2px);box-shadow:0 1px 2px rgba(24,24,27,.05),0 14px 28px -18px rgba(24,24,27,.3);" style-active="transform:scale(.98);" style-focus="outline:2px solid #18181b;outline-offset:3px;">
          <span aria-hidden="true" style="width:44px;height:44px;border-radius:12px;background:{{ it.iconBg }};color:{{ it.iconColor }};display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:23px;font-variation-settings:{{ it.fill }};transition:background .25s, color .25s;">{{ it.icon }}</span>
          <span style="font-size:15px;font-weight:600;letter-spacing:-.015em;color:#18181b;">{{ it.name }}</span>
          <span aria-hidden="true" style="position:absolute;top:16px;right:16px;width:20px;height:20px;border-radius:50%;border:1.5px solid {{ it.radio }};display:grid;place-items:center;transition:border-color .2s;"><span style="width:10px;height:10px;border-radius:50%;background:#18181b;transform:{{ it.dot }};transition:transform .3s cubic-bezier(.3,1.6,.5,1);"></span></span>
        </button>
      </sc-for>
    </div>
  </main>

  <footer style="width:100%;max-width:1015px;margin:0 auto;padding:40px clamp(20px,3vw,40px) 44px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
    <p style="margin:0;font-size:14px;color:#71717a;">A CRM that fits your industry. Ready from day one.</p>
    <div style="display:flex;align-items:center;gap:8px;">
      <button type="button" onClick="{{ back }}" style="height:42px;padding:0 16px;display:flex;align-items:center;gap:2px;border:1px solid #e4e4e7;background:#fff;font-size:14px;font-weight:500;color:#18181b;cursor:pointer;border-radius:12px;transition:background .15s, border-color .15s;" style-hover="background:#f4f4f5;border-color:#d4d4d8;" style-focus="outline:2px solid #18181b;outline-offset:2px;"><span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:18px;">chevron_left</span>Back</button>
      <button type="button" onClick="{{ next }}" disabled="{{ noneSel }}" style="height:42px;padding:0 20px;display:flex;align-items:center;gap:8px;border-radius:12px;border:0;background:{{ nextBg }};color:#fff;font-size:14px;font-weight:600;cursor:{{ nextCursor }};transition:transform .15s, background .2s, filter .15s;" style-hover="filter:brightness(1.08);" style-active="transform:scale(.97);" style-focus="outline:2px solid #5b45d6;outline-offset:3px;">Next<span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:18px;">arrow_forward</span></button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const INDUSTRIES = [
  ['re1','Real Estate','apartment'],['health','Healthcare','health_and_safety'],['retail','Retail','storefront'],['mfg','Manufacturing','precision_manufacturing'],
  ['edu','Education','school'],['logistic','Logistic','conveyor_belt'],['transport','Transport','local_shipping'],['re2','Real Estate','home_work'],
  ['it','IT / Saas','cloud'],['bank','Banking','account_balance'],['hosp','Hospitality / Travel','luggage'],['fin','Finance / Insurance','shield'],
];
class Component extends DCLogic {
  state = { sel: null };
  renderVals() {
    const s = this.state.sel;
    const items = INDUSTRIES.map(([id, name, icon]) => {
      const on = s === id;
      return { id, name, icon, sel: on, pick: () => this.setState({ sel: id }),
        border: on ? '#18181b' : '#e4e4e7',
        shadow: on ? '0 0 0 3px rgba(24,24,27,.08), 0 14px 28px -18px rgba(24,24,27,.35)' : '0 1px 2px rgba(24,24,27,.04)',
        iconBg: on ? '#18181b' : '#f4f4f5', iconColor: on ? '#fff' : '#3f3f46', fill: on ? "'FILL' 1" : "'FILL' 0",
        radio: on ? '#18181b' : '#d4d4d8', dot: on ? 'scale(1)' : 'scale(0)' };
    });
    return { items, noneSel: !s, nextBg: s ? '#5b45d6' : '#c4c4cc', nextCursor: s ? 'pointer' : 'not-allowed', next: () => {}, back: () => {} };
  }
}
</script>
</body>
</html>
